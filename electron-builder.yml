appId: com.pickpulse.timing
productName: PickPulse
asar: true
compression: maximum
directories:
  output: release
files:
  - desktop/main.cjs
  - desktop-dist/**/*
  - package.json
  - "!node_modules/**/*"
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: PickPulse-${version}-portable.${ext}
nsis:
  artifactName: PickPulse-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PickPulse
  runAfterFinish: true
