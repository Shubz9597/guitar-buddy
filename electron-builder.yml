appId: com.guitarbuddy.app
productName: Guitar Buddy
asar: true
compression: maximum
directories:
  output: release
files:
  - electron/*.cjs
  - dist/**/*
  - package.json
  - "!node_modules/**/*"
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: GuitarBuddy-${version}-portable.${ext}
nsis:
  artifactName: GuitarBuddy-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Guitar Buddy
  runAfterFinish: true
